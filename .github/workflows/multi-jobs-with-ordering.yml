name: Multi Jobs with Ordering

on: 
  workflow_dispatch:

jobs:
  job1:
    runs-on: ubuntu-latest
    steps:
      - name: Job 1
        run: echo "This is Job 1"

  job2:
    runs-on: ubuntu-latest
    needs: job1
    steps:
      - name: Job 2
        run: echo "This is Job 2, which runs after Job 1"

  job3:
    runs-on: ubuntu-latest
    needs: job1
    steps:
      - name: Job 3
        run: echo "This is Job 3, which also runs after Job 1"
  job4:
    runs-on: ubuntu-latest
    needs: [job2, job3]
    steps:
      - name: Job 4
        run: echo "This is Job 4, which runs after both Job 2 and Job 3"